<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpendWise — Student Expense Tracker</title>

<meta name="description"
content="SpendWise is a modern student expense tracker for managing income, expenses, budgets and spending habits.">

<style>

/* =========================================================
   GOOGLE FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');


/* =========================================================
   ROOT
========================================================= */

:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --secondary: #8b5cf6;

    --green: #10b981;
    --red: #f43f5e;
    --orange: #f59e0b;
    --blue: #3b82f6;

    --bg: #f5f7fb;
    --surface: rgba(255,255,255,.82);
    --surface-solid: #ffffff;

    --text: #111827;
    --text-soft: #64748b;
    --border: rgba(148,163,184,.20);

    --shadow:
        0 20px 60px rgba(15,23,42,.08);

    --radius: 24px;
}

body.dark {

    --bg: #080b14;
    --surface: rgba(20,25,40,.82);
    --surface-solid: #141927;

    --text: #f8fafc;
    --text-soft: #94a3b8;

    --border: rgba(148,163,184,.14);

    --shadow:
        0 20px 70px rgba(0,0,0,.35);
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family: "DM Sans", sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(139,92,246,.10),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100vh;

    transition:
        background .3s ease,
        color .3s ease;
}


/* =========================================================
   BACKGROUND BLOBS
========================================================= */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -1;
}

.blob {

    position: absolute;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .20;

    animation: float 12s infinite ease-in-out;
}

.blob.one {

    width: 350px;
    height: 350px;

    background: #6366f1;

    top: -150px;
    left: -100px;
}

.blob.two {

    width: 300px;
    height: 300px;

    background: #a855f7;

    right: -100px;
    top: 35%;
    
    animation-delay: -4s;
}

.blob.three {

    width: 250px;
    height: 250px;

    background: #06b6d4;

    bottom: -100px;
    left: 35%;

    animation-delay: -7s;
}

@keyframes float {

    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(30px,-25px) scale(1.08);
    }
}


/* =========================================================
   HEADER
========================================================= */

.header {

    width: 100%;

    padding: 20px 5%;

    position: sticky;

    top: 0;

    z-index: 100;

    backdrop-filter: blur(18px);

    background:
        color-mix(
            in srgb,
            var(--surface-solid) 75%,
            transparent
        );

    border-bottom:
        1px solid var(--border);
}

.nav {

    max-width: 1350px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


/* =========================================================
   LOGO
========================================================= */

.logo {

    display: flex;

    align-items: center;

    gap: 12px;
}

.logo-icon {

    width: 46px;
    height: 46px;

    border-radius: 15px;

    display: grid;

    place-items: center;

    color: white;

    font-size: 21px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 10px 25px
        rgba(99,102,241,.30);
}

.logo h1 {

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size: 18px;

    font-weight: 800;
}

.logo span {

    color: var(--primary);
}

.logo p {

    color: var(--text-soft);

    font-size: 10px;

    margin-top: 2px;
}


/* =========================================================
   NAV ACTIONS
========================================================= */

.nav-actions {

    display: flex;

    align-items: center;

    gap: 10px;
}

.icon-btn {

    width: 43px;
    height: 43px;

    border: 1px solid var(--border);

    border-radius: 13px;

    background: var(--surface);

    color: var(--text);

    cursor: pointer;

    display: grid;

    place-items: center;

    font-size: 17px;

    transition: .25s;
}

.icon-btn:hover {

    transform: translateY(-3px);

    border-color:
        rgba(99,102,241,.4);

    color: var(--primary);
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    max-width: 1350px;

    width: 90%;

    margin: auto;

    padding: 50px 0 80px;
}


/* =========================================================
   HERO
========================================================= */

.hero {

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 30px;

    margin-bottom: 35px;
}

.eyebrow {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding: 7px 11px;

    border-radius: 100px;

    background:
        rgba(99,102,241,.10);

    color: var(--primary);

    font-size: 11px;

    font-weight: 700;

    margin-bottom: 14px;
}

.live-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 0 4px
        rgba(16,185,129,.12);
}

.hero h2 {

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size:
        clamp(30px,4vw,48px);

    line-height: 1.08;

    letter-spacing: -1.8px;

    margin-bottom: 12px;
}

.hero h2 span {

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}

.hero p {

    color: var(--text-soft);

    max-width: 600px;

    line-height: 1.7;

    font-size: 14px;
}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.primary-btn {

    border: none;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    padding: 14px 20px;

    border-radius: 14px;

    font-family: inherit;

    font-weight: 700;

    cursor: pointer;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    box-shadow:
        0 12px 25px
        rgba(99,102,241,.25);

    transition: .25s;
}

.primary-btn:hover {

    transform: translateY(-3px);

    box-shadow:
        0 17px 35px
        rgba(99,102,241,.32);
}


/* =========================================================
   STAT GRID
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 18px;

    margin-bottom: 22px;
}

.stat-card {

    position: relative;

    overflow: hidden;

    padding: 23px;

    border-radius: var(--radius);

    background: var(--surface);

    backdrop-filter: blur(18px);

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    transition: .3s;
}

.stat-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 25px 60px
        rgba(15,23,42,.12);
}

.stat-card::after {

    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    right: -45px;
    bottom: -55px;

    background:
        var(--accent);

    opacity: .07;
}

.stat-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.stat-title {

    color: var(--text-soft);

    font-size: 12px;

    font-weight: 600;
}

.stat-icon {

    width: 38px;
    height: 38px;

    border-radius: 12px;

    display: grid;

    place-items: center;

    background:
        color-mix(
            in srgb,
            var(--accent) 12%,
            transparent
        );

    color: var(--accent);

    font-size: 17px;
}

.stat-value {

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size: 25px;

    font-weight: 800;

    letter-spacing: -.7px;
}

.stat-footer {

    color: var(--text-soft);

    font-size: 10px;

    margin-top: 8px;
}


/* =========================================================
   MAIN GRID
========================================================= */

.main-grid {

    display: grid;

    grid-template-columns:
        1.55fr .9fr;

    gap: 22px;
}


/* =========================================================
   PANEL
========================================================= */

.panel {

    background: var(--surface);

    backdrop-filter: blur(18px);

    border:
        1px solid var(--border);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    overflow: hidden;
}

.panel-header {

    padding: 23px 25px;

    border-bottom:
        1px solid var(--border);

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;
}

.panel-title {

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 4px;
}

.panel-subtitle {

    color: var(--text-soft);

    font-size: 11px;
}


/* =========================================================
   FILTERS
========================================================= */

.filters {

    display: flex;

    gap: 8px;
}

.search {

    width: 150px;

    border:
        1px solid var(--border);

    background:
        rgba(148,163,184,.07);

    color: var(--text);

    padding: 9px 11px;

    border-radius: 10px;

    outline: none;

    font-family: inherit;

    font-size: 11px;
}

.select {

    border:
        1px solid var(--border);

    background:
        rgba(148,163,184,.07);

    color: var(--text);

    padding: 9px;

    border-radius: 10px;

    outline: none;

    font-family: inherit;

    font-size: 11px;
}


/* =========================================================
   TRANSACTIONS
========================================================= */

.transactions {

    min-height: 390px;
}

.transaction {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding: 17px 25px;

    border-bottom:
        1px solid var(--border);

    transition: .2s;
}

.transaction:hover {

    background:
        rgba(99,102,241,.035);
}

.transaction-left {

    display: flex;

    align-items: center;

    gap: 13px;

    min-width: 0;
}

.transaction-icon {

    width: 42px;
    height: 42px;

    border-radius: 13px;

    display: grid;

    place-items: center;

    font-size: 18px;

    flex-shrink: 0;
}

.transaction-info {

    min-width: 0;
}

.transaction-name {

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.transaction-meta {

    color: var(--text-soft);

    font-size: 10px;

    margin-top: 4px;
}

.transaction-right {

    display: flex;

    align-items: center;

    gap: 12px;
}

.transaction-amount {

    font-size: 13px;

    font-weight: 800;

    white-space: nowrap;
}

.income {

    color: var(--green);
}

.expense {

    color: var(--red);
}

.delete {

    border: none;

    width: 29px;
    height: 29px;

    border-radius: 8px;

    background: transparent;

    color: var(--text-soft);

    cursor: pointer;

    transition: .2s;
}

.delete:hover {

    color: var(--red);

    background:
        rgba(244,63,94,.10);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {

    padding: 80px 25px;

    text-align: center;

    color: var(--text-soft);
}

.empty-icon {

    width: 58px;
    height: 58px;

    margin: auto auto 14px;

    border-radius: 17px;

    background:
        rgba(99,102,241,.08);

    display: grid;

    place-items: center;

    font-size: 25px;
}

.empty h3 {

    color: var(--text);

    font-size: 14px;

    margin-bottom: 6px;
}

.empty p {

    font-size: 11px;
}


/* =========================================================
   SIDE PANEL
========================================================= */

.side-content {

    padding: 25px;
}


/* =========================================================
   DONUT CHART
========================================================= */

.donut-wrap {

    display: flex;

    justify-content: center;

    padding: 15px 0 28px;
}

.donut {

    width: 190px;
    height: 190px;

    border-radius: 50%;

    background:
        conic-gradient(
            var(--primary) 0deg,
            var(--secondary) 0deg,
            #e5e7eb 0deg
        );

    display: grid;

    place-items: center;

    position: relative;

    transition: .6s;
}

body.dark .donut {

    background:
        conic-gradient(
            var(--primary) 0deg,
            var(--secondary) 0deg,
            #252b3b 0deg
        );
}

.donut::after {

    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background: var(--surface-solid);
}

.donut-center {

    position: relative;

    z-index: 2;

    text-align: center;
}

.donut-center strong {

    display: block;

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size: 21px;
}

.donut-center span {

    color: var(--text-soft);

    font-size: 10px;
}


/* =========================================================
   LEGEND
========================================================= */

.legend {

    display: grid;

    gap: 10px;
}

.legend-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 11px;
}

.legend-left {

    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--text-soft);
}

.dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;
}


/* =========================================================
   BUDGET
========================================================= */

.budget {

    margin-top: 27px;

    padding-top: 23px;

    border-top:
        1px solid var(--border);
}

.budget-head {

    display: flex;

    justify-content: space-between;

    margin-bottom: 12px;
}

.budget-head span {

    font-size: 11px;

    color: var(--text-soft);
}

.budget-head strong {

    font-size: 12px;
}

.progress {

    height: 9px;

    border-radius: 100px;

    background:
        rgba(148,163,184,.15);

    overflow: hidden;
}

.progress-bar {

    height: 100%;

    width: 0%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    transition:
        width .7s ease;
}

.budget-note {

    color: var(--text-soft);

    font-size: 10px;

    margin-top: 9px;
}


/* =========================================================
   TIP
========================================================= */

.tip {

    margin-top: 22px;

    padding: 18px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(99,102,241,.10),
            rgba(139,92,246,.07)
        );

    border:
        1px solid
        rgba(99,102,241,.12);
}

.tip-title {

    color: var(--primary);

    font-size: 11px;

    font-weight: 800;

    margin-bottom: 7px;
}

.tip p {

    color: var(--text-soft);

    font-size: 10px;

    line-height: 1.6;
}


/* =========================================================
   MODAL
========================================================= */

.modal-bg {

    position: fixed;

    inset: 0;

    background:
        rgba(2,6,23,.60);

    backdrop-filter: blur(8px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 200;

    opacity: 0;

    visibility: hidden;

    transition: .25s;
}

.modal-bg.active {

    opacity: 1;

    visibility: visible;
}

.modal {

    width: min(480px,100%);

    max-height: 90vh;

    overflow-y: auto;

    background: var(--surface-solid);

    border:
        1px solid var(--border);

    border-radius: 25px;

    padding: 27px;

    transform:
        translateY(20px)
        scale(.97);

    transition: .3s;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.25);
}

.modal-bg.active .modal {

    transform:
        translateY(0)
        scale(1);
}

.modal-top {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    margin-bottom: 25px;
}

.modal h2 {

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size: 20px;

    margin-bottom: 5px;
}

.modal-sub {

    color: var(--text-soft);

    font-size: 11px;
}

.close {

    width: 35px;
    height: 35px;

    border: none;

    border-radius: 10px;

    background:
        rgba(148,163,184,.10);

    color: var(--text);

    cursor: pointer;

    font-size: 20px;
}


/* =========================================================
   FORM
========================================================= */

.form-group {

    margin-bottom: 17px;
}

.form-label {

    display: block;

    font-size: 11px;

    font-weight: 700;

    margin-bottom: 8px;
}

.input,
.form-select {

    width: 100%;

    border:
        1px solid var(--border);

    background:
        rgba(148,163,184,.07);

    color: var(--text);

    padding: 13px;

    border-radius: 12px;

    outline: none;

    font-family: inherit;

    font-size: 12px;

    transition: .2s;
}
